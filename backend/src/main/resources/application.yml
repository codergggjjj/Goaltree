spring:
  application:
    name: Goaltree
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goalflow?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:goalflow}
    password: ${DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /docs

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
